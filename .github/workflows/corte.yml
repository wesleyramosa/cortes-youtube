name: corte

on:
  # Disparado pelo n8n: POST /repos/{dono}/{repo}/dispatches {"event_type":"corte","client_payload":{...}}
  repository_dispatch:
    types: [corte]
  # Disparo manual pela aba Actions, para testes
  workflow_dispatch:
    inputs:
      video_id:
        description: ID do vídeo no YouTube
        required: true
      tema:
        description: Tema do canal
        default: ""
      num_cortes:
        default: "1"
      publicar:
        type: choice
        options: [nao, sim]
        default: nao
      privacidade:
        type: choice
        options: [private, unlisted, public]
        default: private
      formato:
        type: choice
        options: [auto, blur, crop]
        default: auto
      horarios:
        description: Horários de publicação (ISO, separados por vírgula), um por corte
        default: ""

concurrency:
  group: corte-${{ github.event.client_payload.video_id || inputs.video_id }}

jobs:
  corte:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
      TEMA: ${{ github.event.client_payload.tema || inputs.tema }}
      NUM_CORTES: ${{ github.event.client_payload.num_cortes || inputs.num_cortes || '1' }}
      PUBLICAR: ${{ github.event.client_payload.publicar || inputs.publicar || 'nao' }}
      PRIVACIDADE: ${{ github.event.client_payload.privacidade || inputs.privacidade || 'private' }}
      FORMATO: ${{ github.event.client_payload.formato || inputs.formato || 'auto' }}
      MARCA_DAGUA: ${{ vars.MARCA_DAGUA || '@canalimpulsoreal' }}
      HORARIOS: ${{ github.event.client_payload.horarios || inputs.horarios }}
      IDIOMA: ${{ github.event.client_payload.idioma || 'pt' }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url || vars.CALLBACK_URL }}
      CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Cache do modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}

      - name: Cookies do YouTube
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi

      - name: Pipeline
        run: python pipeline.py

      - name: Guardar cortes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortes-${{ env.VIDEO_ID }}
          path: saida/
          retention-days: 7
          if-no-files-found: ignore

      - name: Avisar falha
        if: failure() && env.CALLBACK_URL != ''
        run: |
          jq -n --arg v "$VIDEO_ID" --arg t "$TEMA" --arg r "$RUN_URL" \
            '{status:"erro", video_id:$v, tema:$t, run_url:$r}' |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -H "x-token: $CALLBACK_TOKEN" --data-binary @- || true
