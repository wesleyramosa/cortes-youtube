name: corte-drive

on:
  # Disparado pelo n8n: POST /repos/{dono}/{repo}/dispatches
  # {"event_type":"corte-drive","client_payload":{"drive_file_id":"...","pasta_saida":"...", ...}}
  repository_dispatch:
    types: [corte-drive]
  # Disparo manual pela aba Actions, para testes
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: ID do vídeo no Google Drive
        required: true
      pasta_saida:
        description: ID da pasta do Drive para os cortes prontos
        required: true
      num_cortes:
        default: "3"
      marca:
        description: Perfil em marcas/ (cores, fontes, logo, CTA), ex. psicologia-expressa
        default: ""
      tema:
        description: Assunto do vídeo (vazio = o tema do perfil da marca)
        default: ""
      cta:
        description: Texto do botão (vazio = o do perfil da marca)
        default: ""
      logo_id:
        description: ID do logo (PNG) no Drive
        default: ""
      fundo_id:
        description: ID da imagem de fundo no Drive (vazio = vídeo desfocado)
        default: ""
      cor:
        description: Cor de destaque (hex, sem #; vazio = a do perfil)
        default: ""
      titulo_topo:
        description: Título fixo do topo (vazio = a IA cria um por corte)
        default: ""

concurrency:
  group: drive-${{ github.event.client_payload.drive_file_id || inputs.drive_file_id }}

jobs:
  corte:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DRIVE_FILE_ID: ${{ github.event.client_payload.drive_file_id || inputs.drive_file_id }}
      DRIVE_PASTA_SAIDA: ${{ github.event.client_payload.pasta_saida || inputs.pasta_saida }}
      NUM_CORTES: ${{ github.event.client_payload.num_cortes || inputs.num_cortes || '3' }}
      TEMA: ${{ github.event.client_payload.tema || inputs.tema }}
      MARCA: ${{ github.event.client_payload.marca || inputs.marca }}
      CTA: ${{ github.event.client_payload.cta || inputs.cta }}
      CTA_SUB: ${{ github.event.client_payload.cta_sub }}
      FUNDO_COR: ${{ github.event.client_payload.fundo_cor }}
      LOGO_ID: ${{ github.event.client_payload.logo_id || inputs.logo_id }}
      FUNDO_ID: ${{ github.event.client_payload.fundo_id || inputs.fundo_id }}
      COR_DESTAQUE: ${{ github.event.client_payload.cor || inputs.cor }}
      TITULO_TOPO: ${{ github.event.client_payload.titulo_topo || inputs.titulo_topo }}
      DUR_MIN: ${{ github.event.client_payload.dur_min || '20' }}
      DUR_MAX: ${{ github.event.client_payload.dur_max || '58' }}
      IDIOMA: ${{ github.event.client_payload.idioma || 'pt' }}
      FORMATO: moldura
      INICIO_S: ${{ github.event.client_payload.inicio_s }}
      NUMERO_INICIAL: ${{ github.event.client_payload.numero_inicial || '1' }}
      CORTES_JSON: ${{ toJSON(github.event.client_payload.cortes) }}
      PUBLICAR: nao
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
      CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
      GD_CLIENT_ID: ${{ secrets.GD_CLIENT_ID }}
      GD_CLIENT_SECRET: ${{ secrets.GD_CLIENT_SECRET }}
      GD_REFRESH_TOKEN: ${{ secrets.GD_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Cache do modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}

      # Os cortes vão direto para a pasta do Drive. Não há upload-artifact de propósito:
      # o repositório é público e o vídeo pode ser de cliente.
      - name: Pipeline
        run: python pipeline.py

      - name: Avisar falha
        if: failure() && env.CALLBACK_URL != ''
        run: |
          jq -n --arg d "$DRIVE_FILE_ID" --arg r "$RUN_URL" \
            '{status:"erro", drive_id:$d, run_url:$r}' |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -H "x-token: $CALLBACK_TOKEN" --data-binary @- || true
