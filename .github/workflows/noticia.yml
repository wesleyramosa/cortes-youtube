name: noticia

on:
  # Disparado pelo n8n: POST /repos/{dono}/{repo}/dispatches {"event_type":"noticia","client_payload":{...}}
  repository_dispatch:
    types: [noticia]
  # Disparo manual pela aba Actions, para testes
  workflow_dispatch:
    inputs:
      titulo:
        description: Título da notícia
        required: true
      texto:
        description: Texto da notícia
        required: true
      url:
        description: Link da fonte
        default: ""
      publicar:
        type: choice
        options: [nao, sim]
        default: nao
      privacidade:
        type: choice
        options: [private, unlisted, public]
        default: private

concurrency:
  group: noticia-${{ github.run_id }}

jobs:
  noticia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTICIA_TITULO: ${{ github.event.client_payload.titulo || inputs.titulo }}
      NOTICIA_TEXTO: ${{ github.event.client_payload.texto || inputs.texto }}
      NOTICIA_URL: ${{ github.event.client_payload.url || inputs.url }}
      NUM_CENAS: ${{ github.event.client_payload.cenas || '6' }}
      VOZ: ${{ github.event.client_payload.voz || vars.VOZ || 'pt-BR-AntonioNeural' }}
      VELOCIDADE: ${{ vars.VELOCIDADE || '+10%' }}
      PUBLICAR: ${{ github.event.client_payload.publicar || inputs.publicar || 'nao' }}
      PRIVACIDADE: ${{ github.event.client_payload.privacidade || inputs.privacidade || 'private' }}
      PUBLICAR_EM: ${{ github.event.client_payload.publicar_em }}
      MARCA_NOTICIA: ${{ vars.MARCA_NOTICIA }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url || vars.CALLBACK_URL_NOTICIA }}
      CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_MODELO: ${{ vars.CF_MODELO || '@cf/black-forest-labs/flux-1-schnell' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Dependências
        run: pip install requests edge-tts google-api-python-client google-auth

      - name: Gerar vídeo
        run: python noticia.py

      - name: Avisar falha ao n8n
        if: failure() && env.CALLBACK_URL != ''
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-token: $CALLBACK_TOKEN" \
            -d "$(jq -n --arg t "$NOTICIA_TITULO" --arg r "$RUN_URL" '{status:"erro", noticia_titulo:$t, run_url:$r}')" || true

      - name: Guardar vídeo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticia-${{ github.run_id }}
          path: |
            saida/noticia.mp4
            saida/noticia.json
            trabalho/noticia/roteiro.json
            trabalho/noticia/cena_*.png
